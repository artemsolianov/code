<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAVVY KID — Funnel Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1C1C1E;
      font-family: 'Figtree', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 48px 16px;
    }

    /* ── Label above each phone ── */
    .screen-label {
      font-family: 'Figtree', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: -36px;
      align-self: center;
    }

    /* ══════════════════════════════
       iPhone frame
    ══════════════════════════════ */
    .iphone {
      position: relative;
      width: 430px;
      background: #1A1A1A;
      border-radius: 54px;
      padding: 14px;
      box-shadow:
        0 0 0 1px #3A3A3C,
        0 0 0 2px #2C2C2E,
        inset 0 0 0 1px #3A3A3C,
        0 40px 80px rgba(0,0,0,0.6);
    }

    /* Volume buttons */
    .iphone::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 120px;
      width: 4px;
      height: 34px;
      background: #2C2C2E;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 44px 0 #2C2C2E, 0 88px 0 #2C2C2E;
    }
    /* Power button */
    .iphone::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 160px;
      width: 4px;
      height: 64px;
      background: #2C2C2E;
      border-radius: 0 2px 2px 0;
    }

    .iphone-inner {
      background: #fff;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
    }

    /* Dynamic Island */
    .iphone-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #1A1A1A;
      border-radius: 20px;
      z-index: 10;
    }

    /* Status bar spacer */
    .iphone-statusbar {
      height: 54px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 6px;
      position: relative;
      z-index: 5;
    }
    .sb-time {
      font-size: 15px;
      font-weight: 700;
      color: #262528;
      letter-spacing: -0.01em;
    }
    .sb-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sb-icons svg { display: block; }

    /* Home indicator */
    .iphone-home {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .iphone-home-bar {
      width: 134px;
      height: 5px;
      background: #262528;
      border-radius: 99px;
      opacity: 0.18;
    }

    /* ══════════════════════════════
       Screen content
    ══════════════════════════════ */
    .screen { background: #fff; }

    .progress-wrap { padding: 8px 20px 0; }
    .progress-track { height: 4px; background: #F0EDE9; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: #EE942A; border-radius: 99px; }

    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      background: #F5F4F2; margin: 12px 20px 0; cursor: pointer;
    }

    .q-body { padding: 10px 20px 24px; }
    .q-title { font-size: 21px; font-weight: 800; line-height: 1.25; color: #262528; margin-bottom: 6px; }
    .q-subtitle { font-size: 13px; font-weight: 500; color: rgba(38,37,40,0.50); margin-bottom: 16px; line-height: 1.4; }

    .options { display: flex; flex-direction: column; gap: 9px; }
    .option {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px; border-radius: 14px;
      background: #F8F7F5; border: 1.5px solid transparent; cursor: pointer;
    }
    .option:hover { border-color: #5B6BF5; }
    .option-icon { font-size: 20px; line-height: 1; flex-shrink: 0; }
    .option-text { font-size: 15px; font-weight: 600; color: #262528; line-height: 1.3; }
    .multi-option {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px; border-radius: 14px;
      background: #F8F7F5; border: 1.5px solid transparent; cursor: pointer;
    }
    .multi-checkbox { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #D8D5D0; margin-left: auto; flex-shrink: 0; }

    .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 24px; }
    .photo-card { border-radius: 16px; background: #F8F7F5; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
    .photo-card:hover { border-color: #5B6BF5; }
    .photo-placeholder {
      width: 100%; aspect-ratio: 1;
      background: linear-gradient(135deg, #F0EDE9 0%, #E5E1DC 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; color: rgba(38,37,40,0.3);
      letter-spacing: 0.05em; text-transform: uppercase; text-align: center; padding: 8px;
    }
    .photo-card-label { padding: 9px; font-size: 13px; font-weight: 700; color: #262528; text-align: center; }

    .cta-wrap { padding: 0 20px 12px; }
    .cta-btn {
      width: 100%; height: 52px; border-radius: 99px;
      background: #5B6BF5; border: none;
      font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 700; color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .cta-btn.ghost { background: #EEEEF8; color: #5B6BF5; }

    /* Info screens */
    .info-screen { background: #FFF8F0; }
    .info-photo-area {
      width: 100%; height: 240px;
      background: linear-gradient(160deg, #F5E6CC 0%, #EDD6AA 100%);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .info-photo-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(38,37,40,0.30); }
    .info-card { background: #fff; border-radius: 28px 28px 0 0; margin-top: -24px; padding: 24px 24px 8px; }
    .info-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(91,107,245,0.10); border-radius: 99px; padding: 5px 10px;
      font-size: 11px; font-weight: 700; color: #5B6BF5;
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px;
    }
    .info-quote-mark { font-size: 30px; line-height: 1; color: #EE942A; margin-bottom: 8px; }
    .info-title { font-size: 21px; font-weight: 800; line-height: 1.25; color: #262528; margin-bottom: 10px; }
    .info-title .hi { color: #EE942A; }
    .info-body { font-size: 14px; font-weight: 500; line-height: 1.6; color: rgba(38,37,40,0.60); margin-bottom: 12px; }
    .info-body strong { color: #262528; font-weight: 700; }
    .info-body .savvy { color: #EE942A; font-weight: 700; }
    .info-author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .info-author-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#F0EDE9,#D8D5D0); overflow: hidden; flex-shrink: 0; }
    .info-author-name { font-size: 14px; font-weight: 700; color: #262528; }
    .info-author-role { font-size: 12px; color: rgba(38,37,40,0.50); font-weight: 500; }
    .info-rating { font-size: 13px; color: rgba(38,37,40,0.50); font-weight: 600; }
    .info-rating .stars { color: #EE942A; }

    .checklist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .check-item { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; font-weight: 500; color: rgba(38,37,40,0.70); line-height: 1.4; }
    .check-icon { width: 20px; height: 20px; border-radius: 50%; background: #5B6BF5; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; }

    .compare-wrap { padding: 12px 20px 24px; }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .compare-col-head { font-size: 15px; font-weight: 800; color: #262528; margin-bottom: 8px; text-align: center; }
    .compare-photo { width: 100%; aspect-ratio: 0.85; border-radius: 14px; background: linear-gradient(135deg,#F0EDE9,#D8D5D0); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: rgba(38,37,40,0.3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .compare-item { font-size: 12px; font-weight: 500; color: rgba(38,37,40,0.65); line-height: 1.4; padding: 5px 0; border-top: 1px solid #F0EDE9; }

    .analyze-photo { width: 100%; height: 220px; background: linear-gradient(160deg,#F5E6CC,#EDD6AA); display: flex; align-items: center; justify-content: center; }
    .analyze-body { padding: 24px 24px 16px; }
    .analyze-title { font-size: 21px; font-weight: 800; color: #262528; margin-bottom: 20px; }
    .analyze-row { margin-bottom: 14px; }
    .analyze-row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .analyze-row-label { font-size: 13px; font-weight: 600; color: #262528; }
    .analyze-row-pct { font-size: 12px; font-weight: 700; color: #5B6BF5; }
    .analyze-track { height: 8px; background: #F0EDE9; border-radius: 99px; overflow: hidden; }
    .analyze-fill { height: 100%; background: linear-gradient(90deg,#5B6BF5,#8B97F8); border-radius: 99px; }

    .hero-inner { padding: 20px 24px 24px; }
    .hero-badge { display: inline-flex; align-items: center; gap: 6px; background: #F8F7F5; border-radius: 99px; padding: 6px 14px; font-size: 11px; font-weight: 600; color: rgba(38,37,40,0.55); margin-bottom: 16px; border: 1px solid #EDECEA; }
    .hero-mockups { display: flex; align-items: flex-end; justify-content: center; height: 180px; position: relative; margin-bottom: 20px; }
    .hero-phone { width: 100px; height: 170px; border-radius: 18px; flex-shrink: 0; overflow: hidden; }
    .hero-phone.left { background: linear-gradient(155deg,#7C74FF,#A49DFF); transform: rotate(-12deg) translateX(18px); z-index: 1; height: 154px; box-shadow: 0 8px 24px rgba(108,99,255,0.2); }
    .hero-phone.center { background: linear-gradient(155deg,#6C63FF,#9B95FF); z-index: 3; transform: translateY(-12px); box-shadow: 0 12px 32px rgba(108,99,255,0.3); }
    .hero-phone.right { background: linear-gradient(155deg,#FF8C42,#FFB47A); transform: rotate(12deg) translateX(-18px); z-index: 2; height: 154px; box-shadow: 0 8px 24px rgba(255,140,66,0.2); }
    .phone-inner { padding: 10px 8px; height: 100%; display: flex; flex-direction: column; gap: 4px; }
    .phone-bar { height: 3px; border-radius: 99px; background: rgba(255,255,255,0.35); }
    .phone-bar.w60 { width: 60%; }
    .phone-bar.w80 { width: 80%; }
    .phone-bar.w40 { width: 40%; }
    .phone-title-mock { font-size: 7px; font-weight: 800; color: #fff; line-height: 1.2; margin-top: 4px; }
    .hero-title { font-size: 24px; font-weight: 800; line-height: 1.2; color: #262528; margin-bottom: 10px; }
    .hero-body { font-size: 14px; font-weight: 500; line-height: 1.6; color: rgba(38,37,40,0.55); margin-bottom: 20px; }
    .hero-progress-label { font-size: 12px; font-weight: 700; color: #EE942A; margin-bottom: 6px; }
    .hero-progress-pct { width: 100%; height: 8px; background: #F0EDE9; border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
    .hero-progress-fill { height: 100%; background: linear-gradient(90deg,#EE942A,#F5B85A); border-radius: 99px; }
    .hero-progress-caption { font-size: 12px; font-weight: 500; color: rgba(38,37,40,0.40); text-align: center; }
  </style>
</head>
<body>

<!-- helper macro as inline block via JS -->
<!-- Each screen is wrapped in .iphone -->

<script>
function iphone(label, html) {
  document.write(`
  <div class="screen-label">${label}</div>
  <div class="iphone">
    <div class="iphone-inner">
      <div class="iphone-island"></div>
      <div class="iphone-statusbar">
        <span class="sb-time">9:41</span>
        <div class="sb-icons">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#262528"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#262528"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#262528"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#262528" opacity=".3"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.5 2.5 12.7 3.6 14.2 5.3L15.5 4C13.6 1.9 11 .5 8 .5S2.4 1.9.5 4L1.8 5.3C3.3 3.6 5.5 2.5 8 2.5Z" fill="#262528"/><path d="M8 5.5C9.7 5.5 11.2 6.2 12.3 7.4L13.6 6.1C12.1 4.5 10.2 3.5 8 3.5S3.9 4.5 2.4 6.1L3.7 7.4C4.8 6.2 6.3 5.5 8 5.5Z" fill="#262528"/><circle cx="8" cy="10" r="2" fill="#262528"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#262528" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#262528"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.5 24.5 6S23.8 4.8 23 4.5Z" fill="#262528" opacity=".4"/></svg>
        </div>
      </div>
      <div class="screen">${html}</div>
      <div class="iphone-home"><div class="iphone-home-bar"></div></div>
    </div>
  </div>`);
}
</script>

<script>
iphone("Screen 1 — Hero", `
  <div class="hero-inner">
    <div class="hero-badge">✦ Crafted by Education Experts ✦</div>
    <div class="hero-mockups">
      <div class="hero-phone left"><div class="phone-inner"><div class="phone-bar w80"></div><div class="phone-title-mock">As kid grows wi...</div><div class="phone-bar w60"></div><div class="phone-bar w40"></div></div></div>
      <div class="hero-phone center"><div class="phone-inner"><div class="phone-bar w80"></div><div class="phone-title-mock">Tantrums Tamed</div><div class="phone-bar w60"></div><div class="phone-bar w80"></div><div class="phone-bar w40"></div></div></div>
      <div class="hero-phone right"><div class="phone-inner"><div class="phone-bar w80"></div><div class="phone-title-mock">As kid grow wi...</div><div class="phone-bar w60"></div><div class="phone-bar w40"></div></div></div>
    </div>
    <h1 class="hero-title">We help turn big feelings and restless energy into a child's superpower</h1>
    <p class="hero-body">Over 6,000 families have used SAVVY KID to support kids with challenges in focus, energy, and emotions.</p>
    <div class="hero-progress-label">Done!</div>
    <div class="hero-progress-pct"><div class="hero-progress-fill" style="width:100%"></div></div>
    <div class="hero-progress-caption">Your child's plan is ready! 🎉</div>
  </div>
  <div class="cta-wrap"><button class="cta-btn">Get the Plan →</button></div>
`);
</script>

  <div class="back-btn"><svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="#262528" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<script>
iphone("Screen 4 — Gender", `
  <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:14%"></div></div></div>
  <div class="back-btn"><svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="#262528" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<script>
iphone("Screen 8 — Tantrums frequency", `
  <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:28%"></div></div></div>
  <div class="back-btn"><svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="#262528" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="q-body">
    <h2 class="q-title">How often does your child have tantrums?</h2>
    <div class="options">
